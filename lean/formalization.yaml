# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "A fast algorithm for elliptic-curve discrete logarithms"
  description: >-
    A Lean 4 proof, against Mathlib, that for every fixed m one Turing machine (Mathlib's TM2 model,
    Turing.TM2ComputableInTime, with every stack alphabet finite) takes as input, in binary
    (Computability.encodeNat), a prime p, a short Weierstrass curve y^2 = x^3 + a x + b over ZMod p,
    an affine point R and a prefix, and outputs the lexicographically least string (for each i, the
    bits of x(P_i) followed by a sign bit of y(P_i)) of a generic decomposition R = P_1 + ... + P_m
    with x(P_i) < ceil(p^{1/m}) that begins with the prefix, or reports that there is none, within
    C_k * 2^(L/k) steps on inputs of length L, for every k >= 1 (time p^{o(1)}). The theorem has no
    hypotheses. The machine is prefix search driven by counts of a network of local checks
    (Schoenhage-Strassen multiplication gadgets) that encodes the elliptic-curve group law; the
    counts are evaluated by the counting engine as re-proved in Lean by Rudich and Rousseau, which
    this development imports and generalizes to a symbolic depth budget. This is the decomposition
    oracle of the paper's index-calculus algorithms; the coverage and linear-algebra proofs of those
    algorithms are paper proofs, not formalized here. The ideas and the Lean code were generated by
    AI (Claude, Anthropic); the author audited the statement, and an independent AI audit checked it
    against brute force on small instances.
  authors:
    - "Kaarel Kaarelson"
  responsible_maintainers:
    - "Kaarel Kaarelson"
  license: "Apache-2.0"

sources:
  - title: "A Fast Algorithm for Elliptic-Curve Discrete Logarithms"
    authors: ["Kaarel Kaarelson"]
    id: "arXiv:XXXX.XXXXX (placeholder)"
    type: "paper"
    location: "Theorem 2(ii); Section 'Formal verification'"
    relationship: "other"
    note: >-
      The paper this formalization accompanies. Theorem 2(ii) (search over the x-string with sign
      bits) is the Lean theorem ECDLP.subexponentialRate; the paper's Lean table lists further
      formalized components.
  - title: "Subexponential Deterministic Factoring (Lean development)"
    authors: ["Isaac Rudich", "Louis-Martin Rousseau"]
    id: "https://github.com/IsaacRudich/SubexponentialDeterministicFactoring, commit c91cc3f4947caca8977e81a5d14244f73b5ae2b1"
    type: "other"
    location: "FactoringAux (vendored in vendor/rudich-factoring)"
    relationship: "other"
    note: >-
      Its Lean proof of the counting engine's correctness and running time, and its compilation to
      Mathlib TM2 machines, are imported and used. Its factoring theorem is not used.
    author_endorsement: "not-contacted"
  - title: "A 2^{o(n)} Time Algorithm for 3-SAT"
    authors: ["Claude (Anthropic)"]
    id: "Preprint, unrefereed, dated 26 October 2026; Lean development in the GitHub repository anthropics/formal-math, folder eth"
    type: "paper"
    location: "Sections 3-5 (networks; the counting engine)"
    relationship: "other"
    note: >-
      Method source of the counting engine (through the Rudich-Rousseau re-proof). No statement,
      definition or code is imported from its Lean development.
    author_endorsement: "not-contacted"
  - title: "Summation polynomials and the discrete logarithm problem on elliptic curves"
    authors: ["Igor Semaev"]
    id: "IACR ePrint 2004/031"
    type: "paper"
    relationship: "background"
    note: "Index calculus with point decompositions; the problem whose decomposition step is solved here."

related_formalizations:
  - id: "https://github.com/IsaacRudich/SubexponentialDeterministicFactoring"
    relationship: "other"
    note: "Vendored dependency (subset of FactoringAux, unmodified)."
  - id: "https://github.com/anthropics/formal-math (folder eth)"
    relationship: "other"
    note: "Lean development of the 3-SAT preprint; not imported."

classification:
  arxiv: ["cs.CR", "math.NT", "cs.CC", "cs.LO"]
  msc2020: ["11Y16", "11G20", "94A60", "68Q25", "68V20"]

status:
  scope: >-
    The main theorem ECDLP.subexponentialRate is fully proved, for every m, with no hypotheses.
    Theorem 2(i) of the paper (counting), the deterministic y-digit search, the coverage bound
    (Theorem 3) and the ECDLP algorithms (Theorems 1 and 4-6) are paper proofs and are not formalized;
    partial coverage chains are formalized with named hypotheses (see the README).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "ECDLP.subexponentialRate"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5", "claude-sonnet", "claude-haiku"]
      framework: "Claude Code"
      tool_setup: >-
        A coordinating Claude agent split the work into lanes and launched sub-agents, each given a
        written task (a lemma or part of the construction), working in a Lean project against Mathlib;
        every result was checked by Lean with axioms printed, and reviewed by independent red-team
        agents.
      prompting_notes: >-
        The author chose the problem, set the research direction, split the work into tasks and
        decided which results to accept. The reduction, the proof strategy and all of the Lean code
        were produced by the AI agents. The author audited the statement.
  notes: "AI-generated."

fidelity:
  divergences: >-
    The output is the x-string with sign bits, not the points; the points follow by a square root.
    Each x_i takes Nat.size B bits with B = sInf {B | p <= B^m}. Time is counted in TM2 steps as a
    function of the total input length, which includes the prefix. Inputs are natural numbers read
    modulo p; invalid inputs (p not prime, singular curve) give the answer none. The constants C_k
    are not computed.

review:
  status: "statement audited by the author and by an independent AI audit; proof not read by a human, machine-checked by Lean"
  notes: >-
    The audit checked the encoding (binary), the meaning of lexLeast, the worst-case time measure and
    the absence of trivializing loopholes, and decided lexLeast 2 on three instances with p = 13 in
    the Lean kernel (ECDLP/L105_Examples.lean), matching a brute-force search. #print axioms shows
    only propext, Classical.choice and Quot.sound.

alignment:
  namespace: "ECDLP"
  statements:
    - source: "Theorem 2(ii): search for the lexicographically least x-string with sign bits in time p^{o(1)}, every m"
      lean: "ECDLP.subexponentialRate"
      module: "Challenge.lean (statement), Solution.lean (proof)"
      status: "proved"

acknowledgements: >-
  Mathlib, whose TM2 machines are due to Mario Carneiro and whose FinTM2 and time notion are due to
  Pim Spelier and Daan van Gent; Isaac Rudich and Louis-Martin Rousseau, whose Lean engine this
  development imports.
