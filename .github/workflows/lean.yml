name: Lean proof check

# Builds the Lean project in lean/ from scratch, fails on any `sorry` outside lean/Challenge.lean, and runs
# leanprover/comparator (with the nanoda kernel and the landrun sandbox) on lean/comparator.json: the proof in
# lean/Solution.lean must have exactly the statement of lean/Challenge.lean and use only the standard axioms.
# Adapted from the CI of anthropics/formal-math (Apache License 2.0).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELAN_VERSION: v4.2.3
  ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
  COMPARATOR_COMMIT: 575674928e239f5bc452aab72d1dd7b0f1326494
  NANODA_COMMIT: 68d5ca9db226849b41a6fff59d796ff19d0a8840
  LANDRUN_COMMIT: 811cfff51ceaf3d9843708aa6d22e9b84ccac8b4

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
        working-directory: lean
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        working-directory: .
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      # The largest modules need more than the runner's 16 GB of memory.
      - name: Add swap
        working-directory: .
        run: |
          sudo swapoff -a || true
          dir=/mnt; [ -d /mnt ] && [ "$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)" -ge 20 ] || dir=/
          sudo fallocate -l 12G "$dir/swapfile2" && sudo chmod 600 "$dir/swapfile2"
          sudo mkswap "$dir/swapfile2" && sudo swapon "$dir/swapfile2"
          free -h; df -h / /mnt || true

      - name: Resolve toolchain and matching lean4export release
        id: pins
        run: |
          toolchain="$(tr -d '[:space:]' < lean-toolchain)"
          tags=("v${toolchain#*:v}")
          if [[ "${tags[0]}" =~ ^(v[0-9]+\.[0-9]+)\.[1-9][0-9]*$ ]]; then tags+=("${BASH_REMATCH[1]}.0"); fi
          for tag in "${tags[@]}"; do
            refs="$(git ls-remote https://github.com/leanprover/lean4export "refs/tags/$tag" "refs/tags/$tag^{}")"
            commit="$(awk -v t="refs/tags/$tag^{}" '$2==t {print $1}' <<<"$refs")"
            [ -n "$commit" ] || commit="$(awk -v t="refs/tags/$tag" '$2==t {print $1}' <<<"$refs")"
            [ -z "$commit" ] || break
          done
          [ -n "$commit" ] || { echo "::error::no lean4export release for $toolchain"; exit 1; }
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
          echo "lean4export_commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Cache elan toolchains
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan
          key: elan-${{ env.ELAN_VERSION }}-${{ steps.pins.outputs.toolchain }}

      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --fail --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/elan.tar.gz" \
              "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
            echo "${ELAN_SHA256}  $RUNNER_TEMP/elan.tar.gz" | sha256sum --check
            mkdir -p "$RUNNER_TEMP/elan"
            tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
            "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the Mathlib cache
        run: lake exe cache get

      - name: lake build (no sorry outside Challenge.lean)
        run: |
          lake build 2>&1 | tee "$RUNNER_TEMP/lake-build.log"
          if grep -F "declaration uses 'sorry'" "$RUNNER_TEMP/lake-build.log" | grep -v -E '(^|[ /])Challenge\.lean:'; then
            echo "::error::sorry outside Challenge.lean"; exit 1
          fi

      - name: Print axioms
        run: lake env lean Verify.lean | tee "$RUNNER_TEMP/axioms.log"

      - name: Cache comparator tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lean-ci-tools
          key: comparator-${{ env.COMPARATOR_COMMIT }}-${{ steps.pins.outputs.lean4export_commit }}-${{ steps.pins.outputs.toolchain }}-${{ env.NANODA_COMMIT }}-${{ env.LANDRUN_COMMIT }}

      - name: Comparator (statement match, standard axioms, two kernels)
        env:
          LEAN4EXPORT_COMMIT: ${{ steps.pins.outputs.lean4export_commit }}
          LOG_DIR: ${{ runner.temp }}/comparator-logs
        run: bash ../.github/scripts/comparator-check.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lean-check-logs
          path: |
            ${{ runner.temp }}/lake-build.log
            ${{ runner.temp }}/axioms.log
            ${{ runner.temp }}/comparator-logs/
          if-no-files-found: ignore
          retention-days: 30
